spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:${DB_NAME:appdb}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiry: PT15M
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
